<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spoonflower Analytics</title>
    <style>
      :root {
        color-scheme: light;
        --surface: #fcfcfb;
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --text-muted: #898781;
        --accent: #2a78d6;
        --border: rgba(11, 11, 11, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --surface: #1a1a19;
          --text-primary: #ffffff;
          --text-secondary: #c3c2b7;
          --text-muted: #898781;
          --accent: #3987e5;
          --border: rgba(255, 255, 255, 0.1);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 280px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--surface);
        color: var(--text-primary);
      }
      .header {
        padding: 14px 16px 10px;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid var(--border);
      }
      .stats {
        padding: 12px 16px;
        display: grid;
        gap: 8px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .stat-label {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .stat-value {
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .empty-state {
        padding: 12px 16px;
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.5;
      }
      .actions {
        padding: 12px 16px 16px;
        display: grid;
        gap: 8px;
      }
      button {
        font-family: inherit;
        font-size: 13px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .last-sync {
        padding: 0 16px 14px;
        font-size: 11px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="header">Spoonflower Analytics</div>
    <div id="stats" class="stats"></div>
    <div id="empty" class="empty-state" hidden>
      No sales data synced yet. Open your Spoondollar history page on Spoonflower — a sync panel appears there automatically.
    </div>
    <div class="actions">
      <button id="open-dashboard">Open Dashboard</button>
    </div>
    <div id="last-sync" class="last-sync"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
